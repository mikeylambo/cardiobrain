name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, lint (hooks rules as errors), unit and property tests, contrast, vite build.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-chromium
          path: test-results
          retention-days: 7

  webkit:
    name: Safari engine (WebKit, iPhone 14)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install webkit
      - run: npx playwright test --project iphone-14-webkit e2e/smoke.spec.ts e2e/flows.spec.ts e2e/features.spec.ts
        env:
          PW_WEBKIT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-webkit
          path: test-results
          retention-days: 7
